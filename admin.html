<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel — DJL Waitlist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #0a0a0a;
      --bg2: #101010;
      --bg3: #161616;
      --bdr: rgba(255, 255, 255, 0.08);
      --gold: #C9A84C;
      --gold-light: #E8C97A;
      --w: #ffffff;
      --gl: #b0b0b0;
      --gm: #707070;
      --font-heading: 'Barlow Condensed', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: var(--bg);
      color: var(--w);
      font-family: var(--font-body);
      font-weight: 300;
      padding: 40px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      border-bottom: 1px solid var(--bdr);
      padding-bottom: 20px;
    }

    .header h1 {
      font-family: var(--font-heading);
      font-weight: 900;
      font-size: 40px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    
    .header h1 span { color: var(--gold); }

    .card {
      background: var(--bg2);
      border: 1px solid var(--bdr);
      padding: 24px;
      border-radius: 4px;
    }
    
    .stats {
      display: flex;
      gap: 20px;
      margin-bottom: 40px;
    }

    .stat-box {
      flex: 1;
      background: var(--bg3);
      border: 1px solid var(--bdr);
      padding: 24px;
      text-align: center;
    }

    .stat-box .number {
      font-family: var(--font-heading);
      font-size: 48px;
      color: var(--gold);
      font-weight: 900;
      line-height: 1;
    }

    .stat-box .label {
      font-size: 12px;
      color: var(--gl);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-top: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--bg3);
      border: 1px solid var(--bdr);
    }

    th, td {
      padding: 16px 24px;
      text-align: left;
      border-bottom: 1px solid var(--bdr);
    }

    th {
      font-family: var(--font-heading);
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--gold);
      background: rgba(201, 168, 76, 0.05);
    }

    td {
      font-size: 14px;
      color: var(--gl);
    }
    
    td.name {
      color: var(--w);
      font-weight: 500;
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    .action-btn {
      display: inline-block;
      background: transparent;
      color: var(--gold);
      border: 1px solid var(--gold);
      padding: 8px 16px;
      font-family: var(--font-heading);
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s;
    }

    .action-btn:hover {
      background: var(--gold);
      color: #000;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--gm);
      font-style: italic;
    }

    /* Loader */
    .loader {
      text-align: center;
      padding: 40px;
      color: var(--gold);
      font-family: var(--font-heading);
      font-size: 24px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Admin <span>Panel</span></h1>
      <a href="index.html" style="color: var(--gl); text-decoration: none; font-size: 12px; letter-spacing: 1px; text-transform: uppercase;">&larr; Back to Site</a>
    </div>
    
    <div class="stats">
      <div class="stat-box">
        <div class="number" id="total-count">0</div>
        <div class="label">Total Waitlist Submissions</div>
      </div>
    </div>

    <div class="card">
      <div id="loader" class="loader">Loading submissions...</div>
      <table id="submissions-table" style="display: none;">
        <thead>
          <tr>
            <th>Date</th>
            <th>Name</th>
            <th>Email</th>
            <th>Country</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <!-- Rows injected via JS -->
        </tbody>
      </table>
      <div id="empty-state" class="empty-state" style="display: none;">
        No submissions found. Once users sign up for the waitlist, they will appear here.
      </div>
    </div>
  </div>

  <script>
    async function fetchSubmissions() {
      try {
        const res = await fetch('/api/get-submissions');
        if (!res.ok) throw new Error('Network response was not ok');
        const data = await res.json();
        
        document.getElementById('loader').style.display = 'none';
        
        if (data && data.length > 0) {
          document.getElementById('total-count').textContent = data.length;
          document.getElementById('submissions-table').style.display = 'table';
          
          const tbody = document.getElementById('table-body');
          // Sort by date descending
          data.sort((a, b) => new Date(b.date) - new Date(a.date));
          
          data.forEach(sub => {
            const tr = document.createElement('tr');
            
            const d = new Date(sub.date);
            const formattedDate = !isNaN(d.getTime()) 
              ? d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) 
              : 'N/A';
            
            // Email subject and body template
            const subject = encodeURIComponent('DJL Course — You are on the list!');
            const body = encodeURIComponent(`Hi ${sub.name},\n\nThanks for signing up to the waitlist for the upcoming DJ course.\n\nWe will let you know as soon as the course launches.\n\nBest,\nDJL Team`);
            
            tr.innerHTML = `
              <td>${formattedDate}</td>
              <td class="name">${sub.name}</td>
              <td>${sub.email}</td>
              <td>${sub.country || 'N/A'}</td>
              <td>
                <a href="mailto:${sub.email}?subject=${subject}&body=${body}" class="action-btn">Send Email</a>
              </td>
            `;
            tbody.appendChild(tr);
          });
        } else {
          document.getElementById('empty-state').style.display = 'block';
        }
      } catch (err) {
        console.error('Error fetching submissions:', err);
        document.getElementById('loader').textContent = 'Failed to load submissions. (Are you running locally with Vercel CLI?)';
      }
    }

    document.addEventListener('DOMContentLoaded', fetchSubmissions);
  </script>
</body>
</html>
