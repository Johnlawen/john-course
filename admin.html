<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel — DJL Waitlist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #0a0a0a;
      --bg2: #101010;
      --bg3: #161616;
      --bdr: rgba(255, 255, 255, 0.08);
      --gold: #C9A84C;
      --gold-light: #E8C97A;
      --w: #ffffff;
      --gl: #b0b0b0;
      --gm: #707070;
      --font-heading: 'Barlow Condensed', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: var(--bg);
      color: var(--w);
      font-family: var(--font-body);
      font-weight: 300;
      padding: 40px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      border-bottom: 1px solid var(--bdr);
      padding-bottom: 20px;
    }

    .header h1 {
      font-family: var(--font-heading);
      font-weight: 900;
      font-size: 40px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    
    .header h1 span { color: var(--gold); }

    /* Login Specific Styles */
    .login-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 40vh;
    }
    .login-box {
      background: var(--bg2);
      border: 1px solid var(--bdr);
      padding: 40px;
      text-align: center;
      width: 100%;
      max-width: 400px;
    }
    .login-box input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--bdr);
      color: var(--w);
      padding: 14px 16px;
      margin-bottom: 20px;
      font-size: 14px;
      outline: none;
      font-family: var(--font-body);
    }
    .login-box input:focus {
      border-color: var(--gold);
    }
    .login-box button {
      width: 100%;
      background: var(--gold);
      color: #000;
      border: none;
      padding: 14px;
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .login-box button:hover {
      background: var(--gold-light);
    }
    .error-msg {
      color: #ff4a4a;
      font-size: 12px;
      margin-top: 14px;
      display: none;
    }

    /* Dashboard Styles */
    .card {
      background: var(--bg2);
      border: 1px solid var(--bdr);
      padding: 24px;
      border-radius: 4px;
    }
    
    .stats {
      display: flex;
      gap: 20px;
      margin-bottom: 40px;
    }

    .stat-box {
      flex: 1;
      background: var(--bg3);
      border: 1px solid var(--bdr);
      padding: 24px;
      text-align: center;
    }

    .stat-box .number {
      font-family: var(--font-heading);
      font-size: 48px;
      color: var(--gold);
      font-weight: 900;
      line-height: 1;
    }

    .stat-box .label {
      font-size: 12px;
      color: var(--gl);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-top: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--bg3);
      border: 1px solid var(--bdr);
    }

    th, td {
      padding: 16px 24px;
      text-align: left;
      border-bottom: 1px solid var(--bdr);
    }

    th {
      font-family: var(--font-heading);
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--gold);
      background: rgba(201, 168, 76, 0.05);
    }

    td {
      font-size: 14px;
      color: var(--gl);
    }
    
    td.name {
      color: var(--w);
      font-weight: 500;
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    .action-btn {
      display: inline-block;
      background: transparent;
      color: var(--gold);
      border: 1px solid var(--gold);
      padding: 8px 16px;
      font-family: var(--font-heading);
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s;
    }

    .action-btn:hover {
      background: var(--gold);
      color: #000;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--gm);
      font-style: italic;
    }

    /* Loader */
    .loader {
      text-align: center;
      padding: 40px;
      color: var(--gold);
      font-family: var(--font-heading);
      font-size: 24px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>

  <!-- LOGIN SECTION -->
  <div class="container" id="login-section">
    <div class="header">
      <h1>Admin <span>Login</span></h1>
      <a href="index.html" style="color: var(--gl); text-decoration: none; font-size: 12px; letter-spacing: 1px; text-transform: uppercase;">&larr; Back to Site</a>
    </div>
    
    <div class="login-wrapper">
      <div class="login-box">
        <input type="password" id="password-input" placeholder="Enter Admin Password" onkeydown="if(event.key === 'Enter') handleLogin()" />
        <button onclick="handleLogin()">Login</button>
        <div id="login-error" class="error-msg">Incorrect password. Please try again.</div>
      </div>
    </div>
  </div>

  <!-- DASHBOARD SECTION -->
  <div class="container" id="dashboard-section" style="display: none;">
    <div class="header">
      <h1>Admin <span>Panel</span></h1>
      <button onclick="logout()" class="action-btn" style="border: none; font-size: 12px; letter-spacing: 1px;">Logout &rarr;</button>
    </div>
    
    <div class="stats">
      <div class="stat-box">
        <div class="number" id="total-count">0</div>
        <div class="label">Total Waitlist Submissions</div>
      </div>
    </div>

    <div class="card">
      <div id="loader" class="loader">Loading submissions...</div>
      <table id="submissions-table" style="display: none;">
        <thead>
          <tr>
            <th>Date</th>
            <th>Name</th>
            <th>Email</th>
            <th>Country</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <!-- Rows injected via JS -->
        </tbody>
      </table>
      <div id="empty-state" class="empty-state" style="display: none;">
        No submissions found. Once users sign up for the waitlist, they will appear here.
      </div>
    </div>
  </div>

  <script>
    let adminToken = '';

    // Automatically try to login if token exists in sessionStorage
    document.addEventListener('DOMContentLoaded', () => {
      const savedToken = sessionStorage.getItem('adminToken');
      if (savedToken) {
        adminToken = savedToken;
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('dashboard-section').style.display = 'block';
        fetchSubmissions();
      }
    });

    async function handleLogin() {
      const pass = document.getElementById('password-input').value;
      const errorMsg = document.getElementById('login-error');
      errorMsg.style.display = 'none';
      
      if (!pass) return;

      adminToken = pass;
      
      // Test the token
      try {
        const res = await fetch('/api/get-submissions', {
          headers: { 'Authorization': `Bearer ${adminToken}` }
        });
        
        if (res.ok) {
          // Success
          sessionStorage.setItem('adminToken', adminToken);
          document.getElementById('login-section').style.display = 'none';
          document.getElementById('dashboard-section').style.display = 'block';
          
          const data = await res.json();
          renderData(data);
        } else {
          // Unauthorized
          errorMsg.style.display = 'block';
        }
      } catch (err) {
        console.error(err);
        errorMsg.textContent = 'Server error. Are you running locally?';
        errorMsg.style.display = 'block';
      }
    }

    function logout() {
      sessionStorage.removeItem('adminToken');
      adminToken = '';
      document.getElementById('password-input').value = '';
      document.getElementById('login-section').style.display = 'block';
      document.getElementById('dashboard-section').style.display = 'none';
      document.getElementById('submissions-table').style.display = 'none';
      document.getElementById('loader').style.display = 'block';
      document.getElementById('empty-state').style.display = 'none';
    }

    async function fetchSubmissions() {
      try {
        const res = await fetch('/api/get-submissions', {
          headers: { 'Authorization': `Bearer ${adminToken}` }
        });
        
        if (!res.ok) {
          if (res.status === 401) {
             logout();
             return;
          }
          throw new Error('Network response was not ok');
        }
        
        const data = await res.json();
        renderData(data);
      } catch (err) {
        console.error('Error fetching submissions:', err);
        document.getElementById('loader').textContent = 'Failed to load submissions.';
      }
    }

    function renderData(data) {
      document.getElementById('loader').style.display = 'none';
      
      if (data && data.length > 0) {
        document.getElementById('total-count').textContent = data.length;
        document.getElementById('submissions-table').style.display = 'table';
        
        const tbody = document.getElementById('table-body');
        tbody.innerHTML = ''; // clear out
        
        // Sort by date descending
        data.sort((a, b) => new Date(b.date) - new Date(a.date));
        
        data.forEach(sub => {
          const tr = document.createElement('tr');
          
          const d = new Date(sub.date);
          const formattedDate = !isNaN(d.getTime()) 
            ? d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) 
            : 'N/A';
          
          // Email subject and body template
          const subject = encodeURIComponent('DJL Course — You are on the list!');
          const body = encodeURIComponent(`Hi ${sub.name},\n\nThanks for signing up to the waitlist for the upcoming DJ course.\n\nWe will let you know as soon as the course launches.\n\nBest,\nDJL Team`);
          
          tr.innerHTML = `
            <td>${formattedDate}</td>
            <td class="name">${sub.name}</td>
            <td>${sub.email}</td>
            <td>${sub.country || 'N/A'}</td>
            <td>
              <a href="mailto:${sub.email}?subject=${subject}&body=${body}" class="action-btn">Send Email</a>
            </td>
          `;
          tbody.appendChild(tr);
        });
      } else {
        document.getElementById('empty-state').style.display = 'block';
      }
    }
  </script>
</body>
</html>
